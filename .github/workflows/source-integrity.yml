name: CK3 源码快照字节校验
on:
  pull_request:
    branches: [main]
  push:
    branches: ["import/**"]
  workflow_dispatch:

jobs:
  verify-source-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 核对源码 SHA-256 与编码属性
        run: python "tools/核对源码快照.py"
